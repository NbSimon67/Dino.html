  margin: 0;
  padding: 8px 16px;
  user-select: none;

  font-size: 1em;
  line-height: 1.6em;
  margin: 14vh auto 0;

  width: 100%;

  line-height: 1.55;
  margin: 0 auto;
  max-width: 600px;
  padding-top: 100px;

  width: 100%;

  height: 150px;
  max-width: 600px;
  overflow: hidden;
  position: absolute;
  top: 35px;
  width: 44px;

  height: 150px;
  max-width: 600px;
  opacity: 1;
  overflow: hidden;
  position: absolute;
  top: 0;
  z-index: 10;

  bottom: 0;
  clip-path: polygon(0 0, 0 0, 0 0);

  display: block;
  font-size: xx-small;
  overflow: hidden;
  position: absolute;
  text-align: center;
  user-select: none;

  font-family: 'Segoe UI', Tahoma, sans-serif;
  user-select: none;

#orientation-warning {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;

  color: var(--text-color, #5f6368);
  z-index: 99999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  box-sizing: border-box;
}

  #orientation-warning { display: flex; }
}

.pixel-box {
  border: 2px solid var(--text-color, #5f6368);
  background: var(--background-color, #fff);
  box-shadow: 4px 4px 0px rgba(0,0,0,0.15);

  cursor: pointer;
  z-index: 1000;
  font-size: 13px;
  font-weight: bold;
  color: var(--text-color, #5f6368);

#tg-profile-badge img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
}

  color: var(--text-color, #5f6368);

}

.retro-btn:hover, .retro-btn.active {

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
          document.getElementById('tg-user-name').textContent = user.first_name || "Gracz";
          document.getElementById('modal-name').textContent = (user.first_name || "") + (user.last_name ? " " + user.last_name : "");
          document.getElementById('modal-id').textContent = user.id;
          if (user.photo_url) {
            document.getElementById('tg-user-avatar').src = user.photo_url;
          }
        }
      }
    });

    function toggleGameMenu() {
      const modal = document.getElementById('tg-stats-modal');
      modal.classList.toggle('active');
      const runner = Runner.getInstance();
      if (runner) {
        if (modal.classList.contains('active')) {
          runner.stop();
        } else {
          runner.play();
        }
      }
    }

    function switchTab(tabName, event) {
      document.querySelectorAll('.split-sidebar .retro-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-content-info').style.display = tabName === 'info' ? 'block' : 'none';
      document.getElementById('tab-content-scores').style.display = tabName === 'scores' ? 'block' : 'none';
    }
  </script>
</body>
</html>
